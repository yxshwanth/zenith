name: zenith-v2

on:
  pull_request:
  push:
    branches: [main, master, zenith-v2]

jobs:
  test-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: test-v2
        run: make test-v2
      - name: sim-smoke
        run: make sim-smoke
      - name: race (raft/replica/wal)
        run: make test-race-v2
      - name: zenith-sim elect-put
        run: go run ./cmd/zenith-sim run --seed 42 --profile elect-put
      - name: zenithd disk smoke
        run: |
          d=$(mktemp -d)
          timeout 2 go run ./cmd/zenithd --dev --id=1 --data-dir="$d" \
            --listen=127.0.0.1:17001 --http=127.0.0.1:18001 --grpc=127.0.0.1:19001 \
            || test $? -eq 124
