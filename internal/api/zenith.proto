syntax = "proto3";

package zenith.v1;

option go_package = "github.com/zenith/zenith/internal/api;api";

// Zenith service provides permission checking and tuple management
service Zenith {
  // Write inserts or deletes a relation tuple
  rpc Write(WriteRequest) returns (WriteResponse);
  
  // Check evaluates whether a subject has a relation on an object
  rpc Check(CheckRequest) returns (CheckResponse);
  
  // ListSubjects returns all subjects that have a relation on an object (reverse expansion)
  rpc ListSubjects(ListSubjectsRequest) returns (ListSubjectsResponse);
  
  // BatchCheck processes multiple permission checks in a single call
  // Up to 30 checks can be processed in parallel
  rpc BatchCheck(BatchCheckRequest) returns (BatchCheckResponse);
}

// RelationTuple represents a single permission relationship
message RelationTuple {
  string namespace = 1;        // Object type (e.g., "doc", "folder")
  string object_id = 2;        // Unique instance ID
  string relation = 3;         // Role (e.g., "owner", "viewer", "editor")
  
  // Subject can be either a direct user or a userset (object#relation)
  string subject_namespace = 4; // Subject type ("user" or object namespace)
  string subject_id = 5;       // Subject identifier
  string subject_relation = 6;  // Optional: relation for usersets (e.g., "member")
}

// WriteOperation specifies whether to insert or delete a tuple
enum WriteOperation {
  WRITE_OPERATION_UNSPECIFIED = 0;
  WRITE_OPERATION_INSERT = 1;
  WRITE_OPERATION_DELETE = 2;
}

// WriteRequest contains the tuple and operation to perform
message WriteRequest {
  RelationTuple tuple = 1;
  WriteOperation operation = 2;
}

// WriteResponse returns the Zookie (logical timestamp) after the write
message WriteResponse {
  int64 zookie = 1;  // Logical timestamp from CockroachDB
}

// CheckRequest asks: "Does subject have relation on object?"
message CheckRequest {
  string subject_namespace = 1;
  string subject_id = 2;
  string subject_relation = 3;  // Optional for usersets
  
  string namespace = 4;  // Object namespace
  string object_id = 5;  // Object ID
  string relation = 6;   // Relation to check
  
  int64 required_zookie = 7;  // Optional: ensure check is at least this fresh
}

// CheckResponse indicates whether the permission exists
message CheckResponse {
  bool allowed = 1;   // True if subject has the relation on object
  int64 zookie = 2;   // Logical timestamp of the check
}

// ListSubjectsRequest asks: "Who has relation on object?"
message ListSubjectsRequest {
  string namespace = 1;  // Object namespace
  string object_id = 2;  // Object ID
  string relation = 3;   // Relation to check
  int64 required_zookie = 4;  // Optional: ensure check is at least this fresh
}

// Subject represents a subject (user or userset) with a relation
message Subject {
  string namespace = 1;  // Subject namespace (e.g., "user", "group")
  string id = 2;         // Subject identifier
  string relation = 3;   // Relation (empty for direct users, e.g., "member" for usersets)
}

// ListSubjectsResponse returns all subjects that have the relation on the object
message ListSubjectsResponse {
  repeated Subject subjects = 1;  // List of subjects with the relation
  int64 zookie = 2;               // Logical timestamp of the check
}

// CheckResult represents the result of a single check in a batch
message CheckResult {
  bool allowed = 1;   // True if subject has the relation on object
  int64 zookie = 2;   // Logical timestamp of the check
}

// BatchCheckRequest contains multiple CheckRequest items to process
message BatchCheckRequest {
  repeated CheckRequest requests = 1;  // Up to 30 checks
  int64 required_zookie = 2;          // Optional: ensure all checks are at least this fresh
}

// BatchCheckResponse returns results for all checks in the batch
message BatchCheckResponse {
  repeated CheckResult results = 1;  // Results in the same order as requests
  int64 zookie = 2;                  // Max zookie across all checks (for consistency)
}

