syntax = "proto3";
package zenith.v2;
option go_package = "github.com/yxshwanth/zenith/api/zenith/v2/pb;pb";

message Consistency {
  oneof mode {
    bool fully_consistent = 1;
    string at_least_as_fresh = 2;
    string at_exact_revision = 3;
  }
}

message Tuple {
  string object_namespace = 1;
  string object_id = 2;
  string relation = 3;
  string subject_namespace = 4;
  string subject_id = 5;
  string subject_relation = 6;
}

message CheckRequest {
  string store = 1;
  string object_namespace = 2;
  string object_id = 3;
  string relation = 4;
  string subject_namespace = 5;
  string subject_id = 6;
  Consistency consistency = 7;
  string required_token = 8;
}

message CheckResponse {
  bool allowed = 1;
  string token = 2;
  string error = 3;
}

message BatchCheckRequest {
  string store = 1;
  Consistency consistency = 2;
  repeated CheckRequest items = 3;
}

message BatchCheckResponse {
  uint64 revision = 1;
  string token = 2;
  repeated CheckResponse results = 3;
  string error = 4;
}

message WriteTuplesRequest {
  string store = 1;
  string session = 2;
  uint64 seq = 3;
  repeated Tuple tuples = 4;
  repeated Tuple deletes = 5;
  string request_id = 6;
}

message WriteTuplesResponse {
  string token = 1;
  uint64 revision = 2;
  string error = 3;
}

message CheckContentChangeRequest {
  string store = 1;
  string object_namespace = 2;
  string object_id = 3;
  string relation = 4;
  string subject_namespace = 5;
  string subject_id = 6;
  string request_id = 7;
}

message CheckContentChangeResponse {
  bool allowed = 1;
  string token = 2;
  uint64 revision = 3;
  string error = 4;
}

message ListSubjectsRequest {
  string store = 1;
  string object_namespace = 2;
  string object_id = 3;
  string relation = 4;
  Consistency consistency = 5;
  uint32 limit = 6; // 0 = default bound
}

message Subject {
  string subject_namespace = 1;
  string subject_id = 2;
  string subject_relation = 3;
}

message ListSubjectsResponse {
  repeated Subject subjects = 1;
  string token = 2;
  uint64 revision = 3;
  bool complete = 4;
  string error = 5;
}

message GetRequestOutcomeRequest {
  string session = 1;
  uint64 seq = 2;
  string request_id = 3;
}

message GetRequestOutcomeResponse {
  bool found = 1;
  uint64 revision = 2;
  string result = 3;
  string error = 4;
}

message GetClusterStatusRequest {}

message GetClusterStatusResponse {
  string role = 1;
  uint64 term = 2;
  uint64 commit_index = 3;
  uint64 applied_index = 4;
}

message AddLearnerRequest { uint64 node_id = 1; }
message ProposeJointRequest { repeated uint64 voters = 1; }
message MembershipResponse { string error = 1; bool ok = 2; }

service Zenith {
  rpc Check(CheckRequest) returns (CheckResponse);
  rpc BatchCheck(BatchCheckRequest) returns (BatchCheckResponse);
  rpc WriteTuples(WriteTuplesRequest) returns (WriteTuplesResponse);
  rpc CheckContentChange(CheckContentChangeRequest) returns (CheckContentChangeResponse);
  rpc ListSubjects(ListSubjectsRequest) returns (ListSubjectsResponse);
  rpc GetRequestOutcome(GetRequestOutcomeRequest) returns (GetRequestOutcomeResponse);
  rpc GetClusterStatus(GetClusterStatusRequest) returns (GetClusterStatusResponse);
  rpc AddLearner(AddLearnerRequest) returns (MembershipResponse);
  rpc ProposeJoint(ProposeJointRequest) returns (MembershipResponse);
  rpc ProposeFinalize(GetClusterStatusRequest) returns (MembershipResponse);
}
